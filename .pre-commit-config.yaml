# Local DevSecOps guardrail enforcement (pre-commit / pre-push).
#
# DevSecOps Guardrails epic (jmservera/SquadScope-Coordinator#33), issue #522.
# Mirrors the CI gates so violations are caught before they reach a PR:
#   - ruff (lint + format)  -> matches the CI `lint` job (reusable-ci.yml)
#   - checkov (IaC/Docker)  -> matches the CI `infrastructure` Checkov steps
#   - zizmor (Actions)      -> matches the CI `zizmor` workflow
#   - pytest (unit tests)   -> matches the CI `test` job
#   - compileall (syntax)   -> matches the CI `test` job's compileall step
#   - docker build          -> matches the CI `synthesis-image` build steps
#
# Fast checks (ruff) run on every commit. Slower checks (checkov, zizmor,
# pytest, docker build) run on push to keep the commit loop quick.
#
# Install (one-time):
#   pip install pre-commit
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Run on demand:
#   pre-commit run --all-files
#
# Tool versions are pinned to match CI (ruff 0.15.7, checkov 3.2.533,
# zizmor 1.25.2). When you bump a version in CI, bump the matching `rev`/
# dependency here too — local and CI must stay in lockstep.
#
# Emergency bypass (hotfixes only):
#   git commit --no-verify
#   git push   --no-verify
# Bypassing skips LOCAL hooks only — the CI gates still run. Follow up by fixing
# any skipped findings; never weaken a CI gate to land a change
# (CI must be correct, not just green).

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # ── Ruff: Python lint + format (matches CI `ruff check` / `ruff format --check`)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        name: ruff (lint, autofix)
        args: [--fix]
        files: ^(podcaster|tests)/
      - id: ruff-format
        name: ruff (format)
        files: ^(podcaster|tests)/

  # ── Local hooks (use repo-installed tooling; mirror the CI commands exactly).
  - repo: local
    hooks:
      # checkov: IaC (Bicep) + container (Dockerfile) misconfiguration scan.
      # Mirrors reusable-ci.yml so the same findings (and the same accepted
      # baseline/skips) gate locally. Runs on push only (slower scan).
      - id: checkov
        name: checkov (IaC / Dockerfile scan)
        entry: scripts/hooks/checkov_check.sh
        language: script
        stages: [pre-push]
        files: ^(infra/.*\.bicep|.*Containerfile.*|ui/Dockerfile|\.checkov\.baseline)$
        pass_filenames: false

      # zizmor: GitHub Actions security scan on repo-owned workflows.
      # Blocks on HIGH+ findings (the bar Phase B cleared); the deferred
      # Medium/Informational findings stay in the documented baseline.
      - id: zizmor
        name: zizmor (GitHub Actions security scan)
        entry: scripts/hooks/zizmor_check.sh
        language: script
        stages: [pre-push]
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false

      # pytest: run the unit suite before pushing (matches the CI test job).
      - id: pytest
        name: pytest (unit tests)
        entry: python3 -m pytest tests/ -q
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # compileall: byte-compile the package to catch syntax errors the test
      # selection may miss (matches the CI test job's `python -m compileall`).
      - id: compileall
        name: python compileall (syntax check)
        entry: python3 -m compileall -q podcaster
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # docker build: verify the container images build (matches CI synthesis-image).
      - id: docker-build
        name: docker build (Containerfile / Containerfile.api / ui/Dockerfile)
        entry: scripts/hooks/docker_build_check.sh
        language: script
        stages: [pre-push]
        files: ^(Containerfile.*|ui/Dockerfile|podcaster/.*|ui/.*|requirements.*\.txt|pyproject\.toml)$
        pass_filenames: false
