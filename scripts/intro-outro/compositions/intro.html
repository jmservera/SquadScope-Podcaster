<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />

    <!-- GSAP (timelines registered on window.__timelines, controlled by the runtime) -->
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <!-- Vendored Max Headroom WebGL background web component -->
    <script type="module" src="assets/max-headroom-bg.esm.js"></script>

    <style>
      /* Vendored cyberpunk font (offline-safe, deterministic renders) */
      @font-face {
        font-family: "Orbitron";
        font-style: normal;
        font-weight: 400 900;
        font-display: block;
        src: url("assets/fonts/Orbitron.woff2") format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #05010f;
      }

      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        font-family: "Orbitron", "Arial Black", sans-serif;
        background: radial-gradient(ellipse at center, #0a0320 0%, #05010f 70%, #020008 100%);
      }

      /* WebGL neon-cube background */
      max-headroom-bg {
        position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0;
      }

      /* Dark vignette + scanlines so neon text stays legible over the grid */
      .overlay {
        position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background:
          radial-gradient(ellipse at center, rgba(5,1,15,0) 35%, rgba(5,1,15,0.78) 100%),
          repeating-linear-gradient(
            0deg, rgba(0,0,0,0.0) 0px, rgba(0,0,0,0.0) 2px,
            rgba(0,0,0,0.28) 3px, rgba(0,0,0,0.0) 4px
          );
      }

      .stage {
        position: absolute; inset: 0; z-index: 2;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
      }

      /* ---- Title: Claracle ---- */
      .title {
        position: relative;
        font-size: 220px; font-weight: 900; letter-spacing: 10px;
        color: #f4faff; line-height: 1;
        text-shadow:
          0 0 8px #ffffff,
          0 0 22px #00ffff,
          0 0 48px #00ffff,
          0 0 90px #ff00ff;
        animation: neon-pulse 2.4s ease-in-out infinite;
      }
      /* RGB-split glitch layers */
      .title::before, .title::after {
        content: attr(data-text);
        position: absolute; left: 0; top: 0; width: 100%;
        clip-path: inset(0 0 0 0);
      }
      .title::before {
        color: #00ffff; text-shadow: 0 0 18px #00ffff;
        animation: glitch-cyan 2.6s steps(2, jump-none) infinite; opacity: 0.85;
      }
      .title::after {
        color: #ff00ff; text-shadow: 0 0 18px #ff00ff;
        animation: glitch-magenta 3.1s steps(2, jump-none) infinite; opacity: 0.85;
      }

      @keyframes neon-pulse {
        0%, 100% { text-shadow: 0 0 8px #fff, 0 0 22px #00ffff, 0 0 48px #00ffff, 0 0 90px #ff00ff; }
        50%      { text-shadow: 0 0 6px #fff, 0 0 16px #00ffff, 0 0 30px #00ffff, 0 0 54px #ff00ff; }
      }
      @keyframes glitch-cyan {
        0%, 100% { transform: translate(0,0); clip-path: inset(0 0 0 0); }
        20%  { transform: translate(-4px,-2px); clip-path: inset(12% 0 60% 0); }
        40%  { transform: translate(3px,1px);   clip-path: inset(55% 0 8% 0); }
        60%  { transform: translate(-2px,2px);  clip-path: inset(30% 0 35% 0); }
        80%  { transform: translate(2px,-1px);  clip-path: inset(70% 0 5% 0); }
      }
      @keyframes glitch-magenta {
        0%, 100% { transform: translate(0,0); clip-path: inset(0 0 0 0); }
        25%  { transform: translate(4px,2px);   clip-path: inset(8% 0 64% 0); }
        50%  { transform: translate(-3px,-1px); clip-path: inset(48% 0 18% 0); }
        70%  { transform: translate(2px,2px);   clip-path: inset(26% 0 40% 0); }
        90%  { transform: translate(-2px,1px);  clip-path: inset(66% 0 10% 0); }
      }

      /* ---- Subtitle: Weekly Report ---- */
      .subtitle {
        margin-top: 36px;
        font-size: 70px; font-weight: 700; letter-spacing: 26px; text-indent: 26px;
        color: #ffe14d;
        text-shadow: 0 0 10px rgba(255,225,77,0.85), 0 0 28px rgba(255,200,0,0.5);
      }

      /* ---- Hosts ---- */
      .hosts {
        margin-top: 64px;
        font-size: 50px; font-weight: 500; letter-spacing: 6px;
        color: #e7faff;
      }
      .hosts .accent {
        color: #00ffff; font-weight: 700;
        text-shadow: 0 0 10px #00ffff, 0 0 24px rgba(0,255,255,0.6);
      }
      .hosts .accent.mag {
        color: #ff00ff; text-shadow: 0 0 10px #ff00ff, 0 0 24px rgba(255,0,255,0.6);
      }

      /* ---- AI disclosure ---- */
      .disclosure {
        position: absolute; left: 0; right: 0; bottom: 86px;
        z-index: 3;
        font-size: 28px; font-weight: 500; letter-spacing: 5px;
        color: rgba(190,225,235,0.92); text-align: center;
        text-shadow: 0 0 8px rgba(0,255,255,0.35);
      }
      .disclosure .dot { color: #ff00ff; }
    </style>
  </head>

  <body>
    <div
      id="root"
      data-composition-id="claracle-intro"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="18"
    >
      <max-headroom-bg speed="0.5" fisheye-strength="0.2"></max-headroom-bg>
      <div class="overlay"></div>

      <div class="stage">
        <h1
          id="title"
          class="title clip"
          data-text="Claracle"
          data-start="2"
          data-duration="9"
          data-track-index="2"
        >Claracle</h1>

        <h2
          id="subtitle"
          class="subtitle clip"
          data-start="4"
          data-duration="7"
          data-track-index="3"
        >WEEKLY REPORT</h2>

        <p
          id="hosts"
          class="hosts clip"
          data-start="6"
          data-duration="5"
          data-track-index="4"
        >with <span class="accent">Clarabel</span> &amp; <span class="accent mag">Joracle</span></p>
      </div>

      <p
        id="disclosure"
        class="disclosure clip"
        data-start="8"
        data-duration="3"
        data-track-index="5"
      >AI-generated voice narration <span class="dot">&bull;</span> Data is real</p>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          gsap.set("#title", { opacity: 0 });
          const tl = gsap.timeline({ paused: true });

          // No global fade-in/out here: cross-fades are applied later by the
          // video_compose pipeline. The background keeps animating for ~6 extra
          // seconds after the text beats so the pipeline has room to cross-fade.

          // Title: glitchy neon entrance at t=2s
          tl.fromTo(
            "#title",
            { opacity: 0, scale: 1.18, y: -10, x: -26 },
            { opacity: 1, scale: 1, y: 0, x: 0, duration: 0.7, ease: "power3.out" },
            2.0
          );
          // brief post-entrance horizontal "signal" jitter
          tl.to("#title", { x: 8, duration: 0.05, ease: "none" }, 2.75);
          tl.to("#title", { x: -6, duration: 0.05, ease: "none" }, 2.82);
          tl.to("#title", { x: 0, duration: 0.08, ease: "none" }, 2.9);

          // Subtitle: fade-in at t=4s
          tl.fromTo(
            "#subtitle",
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
            4.0
          );

          // Hosts: elegant fade-in at t=6s
          tl.fromTo(
            "#hosts",
            { opacity: 0, y: 28 },
            { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" },
            6.0
          );

          // AI disclosure: subtle fade-in at t=8s
          tl.fromTo(
            "#disclosure",
            { opacity: 0, y: 14 },
            { opacity: 0.92, y: 0, duration: 0.7, ease: "power1.out" },
            8.0
          );

          window.__timelines["claracle-intro"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
