name: Publish API image

on:
  push:
    branches: [main]
    paths:
      - 'podcaster/**'
      - 'Containerfile.api'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (defaults to commit SHA).
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      dockerfile: Containerfile.api
      image_repository: ${{ vars.API_IMAGE_REPOSITORY || 'podcaster-api' }}
      tag: ${{ inputs.tag }}
    secrets: inherit

  deploy:
    needs: publish
    if: github.event_name == 'push'
    uses: ./.github/workflows/reusable-deploy-azure.yml
    with:
      api_image: ${{ needs.publish.outputs.image_ref || '' }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
