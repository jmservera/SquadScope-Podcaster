name: Publish synthesis image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (defaults to commit SHA).
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      dockerfile: Containerfile
      image_repository: ${{ vars.SYNTHESIS_IMAGE_REPOSITORY || 'podcaster-synthesis' }}
      tag: ${{ inputs.tag }}
    secrets: inherit
