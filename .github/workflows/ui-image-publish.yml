name: Publish UI image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (defaults to commit SHA).
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      dockerfile: ui/Dockerfile
      build_context: ui
      image_repository: ${{ vars.UI_IMAGE_REPOSITORY || 'podcaster-ui' }}
      tag: ${{ inputs.tag }}
    secrets: inherit
