name: Code-only release (reviewed W44/W45 merge)

on:
  workflow_dispatch:
    inputs:
      api_digest:
        description: 'Independently verified scanned 8e65a535 API sha256 digest'
        required: true
        type: string
      worker_digest:
        description: 'Independently verified scanned 8e65a535 worker sha256 digest'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 45
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout reviewed release procedure
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false
      - name: Azure login with existing production identity
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preserve protected configuration and release six immutable images
        env:
          API_DIGEST: ${{ inputs.api_digest }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
        run: |
          set -euo pipefail
          python3 infra/code_only_release.py \
            --api-digest "$API_DIGEST" --worker-digest "$WORKER_DIGEST" --apply
