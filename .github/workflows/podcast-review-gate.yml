name: Podcast Review Gate

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Podcaster job ID to review'
        required: true
        type: string
      podcaster_api_url:
        description: 'Authenticated Podcaster runtime base URL (for example https://podcaster.example)'
        required: false
        default: ''
        type: string
      manifest_url:
        description: 'Private operator manifest URL from /api/generate'
        required: true
        type: string
      publishing_packet_url:
        description: 'Private operator publishing packet URL from /api/generate'
        required: true
        type: string
      decision:
        description: 'Human review decision'
        required: true
        default: 'approved'
        type: choice
        options: ['approved', 'changes_requested', 'rejected']
      notes:
        description: 'Non-secret review notes'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  record-review:
    runs-on: ubuntu-latest
    environment: podcast-review
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate private artifact references
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          PACKET_URL: ${{ inputs.publishing_packet_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          for name in ("MANIFEST_URL", "PACKET_URL"):
              value = os.environ[name]
              parsed = urlparse(value)
              if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                  raise SystemExit(f"{name} must be an http or https URL")
              if parsed.username or parsed.password or parsed.query or parsed.fragment:
                  raise SystemExit(f"{name} must not contain credentials, query strings, or fragments")
          PY

      - name: Set reviewed_at
        id: reviewed_at
        run: echo "value=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Record review decision
        env:
          JOB_ID: ${{ inputs.job_id }}
          PODCASTER_API_URL: ${{ inputs.podcaster_api_url || vars.PODCASTER_API_URL }}
          PODCASTER_API_KEY: ${{ secrets.PODCASTER_API_KEY }}
          MANIFEST_URL: ${{ inputs.manifest_url }}
          PACKET_URL: ${{ inputs.publishing_packet_url }}
          DECISION: ${{ inputs.decision }}
          REVIEW_NOTES: ${{ inputs.notes }}
          REVIEWED_AT: ${{ steps.reviewed_at.outputs.value }}
          REVIEWER: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${PODCASTER_API_URL:-}" ]; then
            echo "::error::PODCASTER_API_URL input or repository/environment variable is required."
            exit 1
          fi
          if [ -z "${PODCASTER_API_KEY:-}" ]; then
            echo "::error::PODCASTER_API_KEY secret is required."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps(
              {
                  "job_id": os.environ["JOB_ID"],
                  "decision": os.environ["DECISION"],
                  "reviewer": os.environ["REVIEWER"],
                  "notes": os.environ["REVIEW_NOTES"],
                  "reviewed_at": os.environ["REVIEWED_AT"],
                  "run_url": os.environ["RUN_URL"],
                  "publish_on_approval": True,
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              os.environ["PODCASTER_API_URL"].rstrip("/") + "/api/review",
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "x-podcaster-api-key": os.environ["PODCASTER_API_KEY"],
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              body = json.loads(response.read().decode("utf-8"))
          manifest = body["manifest"]
          with open("review-manifest.json", "w", encoding="utf-8") as handle:
              handle.write(json.dumps(manifest, sort_keys=True, indent=2) + "\n")
          PY

      - name: Upload review artifact
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: podcast-review-${{ inputs.job_id }}
          path: review-manifest.json
          if-no-files-found: error
