name: Podcast Review Gate

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Podcaster job ID to review'
        required: true
        type: string
      podcaster_api_url:
        description: 'Authenticated Podcaster runtime base URL (for example https://podcaster.example)'
        required: false
        default: ''
        type: string
      manifest_url:
        description: 'Private operator manifest URL from /api/generate'
        required: true
        type: string
      publishing_packet_url:
        description: 'Private operator publishing packet URL from /api/generate'
        required: true
        type: string
      decision:
        description: 'Human review decision'
        required: true
        default: 'approved'
        type: choice
        options: ['approved', 'changes_requested', 'rejected']
      notes:
        description: 'Non-secret review notes'
        required: false
        default: ''
        type: string
      script_sha256:
        description: 'Digest from review.snapshot of the script YOU reviewed (required for pre-TTS approval)'
        required: false
        default: ''
        type: string
      manifest_sha256:
        description: 'Content digest from review.snapshot YOU reviewed (not the upstream manifest hash)'
        required: false
        default: ''
        type: string
      provider_authorization:
        description: 'Pre-TTS policy evidence JSON: see docs/integration-contract.md; no secrets or signed URLs'
        required: false
        default: '{}'
        type: string
      review_checks_confirmed:
        description: 'I reviewed these digest-bound artifacts, claims, rights, disclosure, pronunciation and spoken Markdown'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  record-review:
    runs-on: ubuntu-latest
    environment: podcast-review
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate private artifact references
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          PACKET_URL: ${{ inputs.publishing_packet_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          for name in ("MANIFEST_URL", "PACKET_URL"):
              value = os.environ[name]
              parsed = urlparse(value)
              if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                  raise SystemExit(f"{name} must be an http or https URL")
              if parsed.username or parsed.password or parsed.query or parsed.fragment:
                  raise SystemExit(f"{name} must not contain credentials, query strings, or fragments")
          PY

      - name: Set reviewed_at
        id: reviewed_at
        run: echo "value=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Record review decision
        env:
          JOB_ID: ${{ inputs.job_id }}
          PODCASTER_API_URL: ${{ inputs.podcaster_api_url || vars.PODCASTER_API_URL }}
          PODCASTER_API_KEY: ${{ secrets.PODCASTER_API_KEY }}
          DECISION: ${{ inputs.decision }}
          REVIEW_NOTES: ${{ inputs.notes }}
          REVIEWED_AT: ${{ steps.reviewed_at.outputs.value }}
          REVIEWER: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCRIPT_SHA256: ${{ inputs.script_sha256 }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          PROVIDER_AUTHORIZATION: ${{ inputs.provider_authorization }}
          REVIEW_CHECKS_CONFIRMED: ${{ inputs.review_checks_confirmed }}
        run: |
          set -euo pipefail
          if [ -z "${PODCASTER_API_URL:-}" ]; then
            echo "::error::PODCASTER_API_URL input or repository/environment variable is required."
            exit 1
          fi
          if [ -z "${PODCASTER_API_KEY:-}" ]; then
            echo "::error::PODCASTER_API_KEY secret is required."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          script_sha256 = os.environ["SCRIPT_SHA256"].strip()
          manifest_sha256 = os.environ["MANIFEST_SHA256"].strip()
          if script_sha256 or manifest_sha256:
              if not all(re.fullmatch(r"[0-9a-f]{64}", digest)
                         for digest in (script_sha256, manifest_sha256)):
                  raise SystemExit("Both reviewed digests must be lowercase SHA-256 values")
          try:
              provider_authorization = json.loads(os.environ["PROVIDER_AUTHORIZATION"])
          except ValueError:
              raise SystemExit("Provider authorization must be a JSON object") from None
          if not isinstance(provider_authorization, dict):
              raise SystemExit("Provider authorization must be a JSON object")
          payload = json.dumps(
              {
                  "job_id": os.environ["JOB_ID"],
                  "decision": os.environ["DECISION"],
                  "reviewer": os.environ["REVIEWER"],
                  "notes": os.environ["REVIEW_NOTES"],
                  "reviewed_at": os.environ["REVIEWED_AT"],
                  "run_url": os.environ["RUN_URL"],
                  "publish_on_approval": True,
                  "script_sha256": script_sha256 or None,
                  "manifest_sha256": manifest_sha256 or None,
                  "provider_authorization": provider_authorization,
                  "review_checks_confirmed": os.environ["REVIEW_CHECKS_CONFIRMED"] == "true",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              os.environ["PODCASTER_API_URL"].rstrip("/") + "/api/review",
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "x-podcaster-api-key": os.environ["PODCASTER_API_KEY"],
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              body = json.loads(response.read().decode("utf-8"))
          manifest = body["manifest"]
          with open("review-manifest.json", "w", encoding="utf-8") as handle:
              handle.write(json.dumps(manifest, sort_keys=True, indent=2) + "\n")
          PY

      - name: Upload review artifact
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: podcast-review-${{ inputs.job_id }}
          path: review-manifest.json
          if-no-files-found: error
