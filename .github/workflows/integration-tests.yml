name: Integration Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/integration/**'
      - 'podcaster/video/**'
      - 'ui/**'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python deps
        run: pip install -e ".[dev]" || pip install -e . && pip install pytest
      - name: Build UI
        run: cd ui && npm ci --ignore-scripts && npm run build
      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m "integration"
