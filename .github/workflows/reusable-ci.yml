# CI: lint infrastructure, run tests, build + scan container images.
name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Build Bicep templates
        run: az bicep build --file infra/main.bicep --stdout >/dev/null

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: python -m pip install --upgrade checkov==3.2.533

      - name: Run Checkov
        run: |
          # Keep the scan gating on new findings while deferring the current ACA-only baseline.
          # CKV_AZURE_134 (Cognitive Services public network access) is deferred because the
          # ACA synthesis job reaches Azure OpenAI over the public endpoint; the account
          # still enforces managed-identity-only auth (disableLocalAuth) via user-assigned identity.
          # CKV_AZURE_233 (ACR zone redundancy) requires Premium SKU — Basic is cost-appropriate.
          # CKV_AZURE_139 (ACR public network) needed for GitHub Actions image push via OIDC.
          # CKV_AZURE_163 (ACR vulnerability scanning) requires Defender for Containers — separate.
          # CKV_AZURE_166 (ACR image quarantine) requires Premium SKU.
          checkov --directory infra --framework bicep \
            --skip-check CKV_AZURE_35,CKV_AZURE_43,CKV_AZURE_206,CKV_AZURE_225,CKV_AZURE_15,CKV_AZURE_212,CKV_AZURE_78,CKV_AZURE_213,CKV_AZURE_222,CKV_AZURE_67,CKV_AZURE_18,CKV_AZURE_17,CKV_AZURE_59,CKV_AZURE_134,CKV_AZURE_233,CKV_AZURE_139,CKV_AZURE_163,CKV_AZURE_166

      - name: Run Checkov (Dockerfiles)
        # Phase C of the DevSecOps Guardrails epic (#523): blocking. The
        # `.checkov.baseline` records the accepted existing (LOW) findings so
        # only NEW Dockerfile findings fail CI. See jmservera/SquadScope-Coordinator#33.
        run: |
          checkov --directory . --framework dockerfile \
            --skip-path .worktrees --skip-path ui/node_modules \
            --baseline .checkov.baseline \
            --compact

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,video]"

      - name: Run tests
        run: pytest

      - name: Compile Python
        run: python -m compileall podcaster

  lint:
    # Phase A of the DevSecOps Guardrails epic (#518): Ruff runs in
    # warning-only mode. `continue-on-error` keeps the lane non-blocking so the
    # baseline is visible as annotations without failing CI. Enforcement is
    # deferred to Phase C. See jmservera/SquadScope-Coordinator#33.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install --upgrade ruff==0.15.7

      - name: Ruff lint
        # Phase C (#523): blocking — fails on any ruff violation. Phase B (#521)
        # cleared the baseline to zero, so this gates against regressions.
        run: ruff check podcaster tests --output-format github

      - name: Ruff format check
        # Phase C (#523): blocking — fails if any file is not ruff-formatted.
        run: ruff format --check podcaster tests

      - name: Ruff baseline summary
        if: always()
        run: ruff check podcaster tests --statistics || true

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run tests
        working-directory: ui
        run: npm test

      - name: Build
        working-directory: ui
        run: npm run build

  synthesis-image:
    # Build + scan the ffmpeg synthesis-runner image on PRs (ADR 0001, #77).
    # No registry push happens here; publishing is gated in a separate,
    # operator-approved workflow so this PR lane never incurs registry spend.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Build synthesis image
        run: docker build -f Containerfile -t podcaster-synthesis:ci .

      - name: Verify ffmpeg/ffprobe are baked in
        run: |
          docker run --rm --entrypoint ffmpeg podcaster-synthesis:ci -version | head -n 1
          docker run --rm --entrypoint ffprobe podcaster-synthesis:ci -version | head -n 1

      - name: Verify runner runs as non-root and imports the pipeline
        run: |
          uid="$(docker run --rm --entrypoint id podcaster-synthesis:ci -u)"
          if [ "$uid" = "0" ]; then
            echo "::error::synthesis image must not run as root (uid=$uid)"
            exit 1
          fi
          docker run --rm --entrypoint python podcaster-synthesis:ci \
            -c "import podcaster.job_runner, podcaster.audio, podcaster.episode"

      - name: Scan image for vulnerabilities (Trivy)
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: podcaster-synthesis:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan Containerfile for misconfiguration (Trivy config)
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: Containerfile
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Build API image
        run: docker build -f Containerfile.api -t podcaster-api:ci .

      - name: Verify API image runs as non-root and imports the server
        run: |
          uid="$(docker run --rm --entrypoint id podcaster-api:ci -u)"
          if [ "$uid" = "0" ]; then
            echo "::error::API image must not run as root (uid=$uid)"
            exit 1
          fi
          docker run --rm --entrypoint python podcaster-api:ci \
            -c "import podcaster.api, podcaster.validation, podcaster.jobs"

      - name: Scan API image for vulnerabilities (Trivy)
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: podcaster-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan Containerfile.api for misconfiguration (Trivy config)
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: Containerfile.api
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Build UI image
        run: docker build -f ui/Dockerfile -t podcaster-ui:ci ui/

      - name: Verify UI image serves content and runs as non-root
        run: |
          uid="$(docker run --rm --entrypoint id podcaster-ui:ci -u)"
          if [ "$uid" = "0" ]; then
            echo "::error::UI image must not run as root (uid=$uid)"
            exit 1
          fi
          # Verify index.html is present in the nginx html directory.
          docker run --rm --entrypoint cat podcaster-ui:ci /usr/share/nginx/html/index.html | head -n 1

      - name: Verify env-config.js is generated at container start
        run: |
          cid=$(docker run -d \
            -e VITE_MSAL_CLIENT_ID=test-client-id \
            -e VITE_API_BASE_URL=https://api.test.example.com \
            podcaster-ui:ci)
          sleep 2
          content=$(docker exec "$cid" cat /usr/share/nginx/html/env-config.js)
          docker stop "$cid" > /dev/null
          docker rm "$cid" > /dev/null
          if ! echo "$content" | grep -q 'test-client-id'; then
            echo "::error::env-config.js was not generated with expected runtime env vars"
            echo "$content"
            exit 1
          fi
          echo "env-config.js verified:"
          echo "$content"

      - name: Scan UI image for vulnerabilities (Trivy)
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: podcaster-ui:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan ui/Dockerfile for misconfiguration (Trivy config)
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: ui/Dockerfile
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
