# ACA-only architecture deploy (#109)
name: Reusable Deploy Azure

on:
  workflow_call:
    inputs:
      synthesis_image:
        description: 'Full image ref for synthesis container. Defaults to :latest'
        required: false
        type: string
      api_image:
        description: 'Full image ref for API container. Defaults to :latest'
        required: false
        type: string
      ui_image:
        description: 'Full image ref for UI container. Defaults to :latest'
        required: false
        type: string
      sync_squadscope:
        description: 'Sync API key secret to jmservera/SquadScope when SQUADSCOPE_SYNC_TOKEN is configured'
        required: false
        default: 'false'
        type: string
      deploy_openai:
        description: 'Provision the production Azure OpenAI TTS infrastructure (#30).'
        required: false
        default: 'true'
        type: string
      deploy_vnet:
        description: 'Deploy VNet + private endpoints. ⚠️ Create-time only — enabling on existing ACA requires env recreation (downtime).'
        required: false
        default: 'false'
        type: string
    outputs:
      api_app_fqdn:
        description: 'FQDN of the deployed API container app'
        value: ${{ jobs.deploy.outputs.api_app_fqdn }}
      ui_app_fqdn:
        description: 'FQDN of the deployed UI container app'
        value: ${{ jobs.deploy.outputs.ui_app_fqdn }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    outputs:
      api_app_fqdn: ${{ steps.get_fqdn.outputs.api_app_fqdn }}
      ui_app_fqdn: ${{ steps.get_fqdn.outputs.ui_app_fqdn }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      SYNTHESIS_IMAGE: ${{ inputs.synthesis_image || format('{0}/{1}:latest', vars.SYNTHESIS_IMAGE_REGISTRY, vars.SYNTHESIS_IMAGE_REPOSITORY || 'podcaster-synthesis') }}
      API_IMAGE: ${{ inputs.api_image || format('{0}/{1}:latest', vars.SYNTHESIS_IMAGE_REGISTRY, vars.API_IMAGE_REPOSITORY || 'podcaster-api') }}
      UI_IMAGE: ${{ inputs.ui_image || format('{0}/{1}:latest', vars.SYNTHESIS_IMAGE_REGISTRY, vars.UI_IMAGE_REPOSITORY || 'podcaster-ui') }}
      DEPLOY_VNET: ${{ inputs.deploy_vnet || 'false' }}
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false

      - name: Build Bicep templates
        run: az bicep build --file infra/main.bicep --stdout >/dev/null

      - name: Validate configuration
        env:
          SQUADSCOPE_SYNC_TOKEN: ${{ secrets.SQUADSCOPE_SYNC_TOKEN }}
          SYNC_SQUADSCOPE: ${{ inputs.sync_squadscope }}
        run: |
          set -euo pipefail

          missing=0
          require_config() {
            local name="$1"
            local source="$2"
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in GitHub environment prod $source."
              missing=1
            fi
          }

          require_config AZURE_CLIENT_ID "variables"
          require_config AZURE_TENANT_ID "variables"
          require_config AZURE_SUBSCRIPTION_ID "variables"
          require_config AZURE_LOCATION "variables"
          require_config AZURE_RESOURCE_GROUP "variables"

          if [ "$SYNC_SQUADSCOPE" = "true" ]; then
            require_config SQUADSCOPE_SYNC_TOKEN "secrets for sync_squadscope=true"
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Required configuration present for GitHub environment prod."

      - name: Resolve deployment names and API key
        env:
          PODCASTER_API_KEY_SECRET: ${{ secrets.PODCASTER_API_KEY }}
          SPOTIFY_PUBLISH_ENABLED_VAR: ${{ vars.SPOTIFY_PUBLISH_ENABLED }}
          SPOTIFY_SHOW_ID_SECRET: ${{ secrets.SPOTIFY_SHOW_ID }}
          SPOTIFY_CLIENT_ID_VAR: ${{ vars.SPOTIFY_CLIENT_ID }}
          SP_DC_SECRET: ${{ secrets.SP_DC }}
          SP_KEY_SECRET: ${{ secrets.SP_KEY }}
          PODCAST_AUTO_PUBLISH_VAR: ${{ vars.PODCAST_AUTO_PUBLISH }}
          MSAL_CLIENT_ID_VAR: ${{ vars.MSAL_CLIENT_ID }}
          MSAL_AUTHORITY_VAR: ${{ vars.MSAL_AUTHORITY }}
          UI_AUTH_USERNAME_SECRET: ${{ secrets.UI_AUTH_USERNAME }}
          UI_AUTH_PASSWORD_SECRET: ${{ secrets.UI_AUTH_PASSWORD }}
          UI_AUTH_SECRET_SECRET: ${{ secrets.UI_AUTH_SECRET }}
        run: |
          set -euo pipefail
          set +x

          suffix=$(printf '%s' "${AZURE_SUBSCRIPTION_ID}:${AZURE_RESOURCE_GROUP}" | sha256sum | cut -c1-12)

          storage_prefix=$(printf '%s' "$AZURE_RESOURCE_GROUP" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+//g' \
            | cut -c1-12)
          if [ -z "$storage_prefix" ]; then
            storage_prefix="podcaster"
          fi
          default_storage_account_name="${storage_prefix}${suffix}"

          storage_account_name="${AZURE_STORAGE_ACCOUNT_NAME:-$default_storage_account_name}"

          if ! [[ "$storage_account_name" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "::error::AZURE_STORAGE_ACCOUNT_NAME must be 3-24 lowercase alphanumeric characters."
            exit 1
          fi

          if [ -n "${PODCASTER_API_KEY_SECRET:-}" ]; then
            podcaster_api_key="$PODCASTER_API_KEY_SECRET"
            api_key_source="GitHub environment secret PODCASTER_API_KEY"
          else
            podcaster_api_key=$(openssl rand -hex 32)
            api_key_source="generated during this deployment"
            echo "::warning::PODCASTER_API_KEY is not configured in GitHub environment prod; generated a deployment key."
          fi
          echo "::add-mask::$podcaster_api_key"
          [ -n "${UI_AUTH_PASSWORD_SECRET:-}" ] && echo "::add-mask::$UI_AUTH_PASSWORD_SECRET"
          [ -n "${UI_AUTH_SECRET_SECRET:-}" ] && echo "::add-mask::$UI_AUTH_SECRET_SECRET"

          {
            echo "AZURE_STORAGE_ACCOUNT_NAME=$storage_account_name"
            echo "PODCASTER_API_KEY=$podcaster_api_key"
            echo "SPOTIFY_PUBLISH_ENABLED=${SPOTIFY_PUBLISH_ENABLED_VAR:-false}"
            echo "SPOTIFY_SHOW_ID=${SPOTIFY_SHOW_ID_SECRET:-}"
            echo "SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID_VAR:-}"
            echo "SP_DC=${SP_DC_SECRET:-}"
            echo "SP_KEY=${SP_KEY_SECRET:-}"
            echo "PODCAST_AUTO_PUBLISH=${PODCAST_AUTO_PUBLISH_VAR:-false}"
            echo "MSAL_CLIENT_ID=${MSAL_CLIENT_ID_VAR:-}"
            echo "MSAL_AUTHORITY=${MSAL_AUTHORITY_VAR:-}"
            echo "UI_AUTH_USERNAME=${UI_AUTH_USERNAME_SECRET:-}"
            echo "UI_AUTH_PASSWORD=${UI_AUTH_PASSWORD_SECRET:-}"
            echo "UI_AUTH_SECRET=${UI_AUTH_SECRET_SECRET:-}"
          } >> "$GITHUB_ENV"

          echo "Using Storage Account name: $storage_account_name"
          echo "API key source: $api_key_source; value not printed."

      - name: Azure login
        # azure/login v3.0.0
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image tags to SHA-pinned references
        run: |
          set -euo pipefail
          # ACA does not re-pull :latest when the image ref is unchanged between
          # revisions, leading to stale containers (#166). Resolve :latest to the
          # most recent commit-SHA tag so each deploy gets a unique image reference.
          resolve_latest() {
            local image="$1"
            if [[ "$image" != *":latest" ]]; then
              echo "$image"
              return
            fi
            local registry="${image%%/*}"
            local repo="${image#*/}"
            repo="${repo%:latest}"
            local sha_tag
            sha_tag=$(az acr repository show-tags \
              --name "$registry" \
              --repository "$repo" \
              --orderby time_desc \
              --top 10 \
              --output tsv 2>/dev/null \
              | grep -v '^latest$' | head -1 || true)
            if [ -n "$sha_tag" ]; then
              echo "${registry}/${repo}:${sha_tag}"
            else
              echo "$image"
            fi
          }

          resolved_synth=$(resolve_latest "$SYNTHESIS_IMAGE")
          resolved_api=$(resolve_latest "$API_IMAGE")
          resolved_ui=$(resolve_latest "$UI_IMAGE")

          echo "SYNTHESIS_IMAGE=$resolved_synth" >> "$GITHUB_ENV"
          echo "API_IMAGE=$resolved_api" >> "$GITHUB_ENV"
          echo "UI_IMAGE=$resolved_ui" >> "$GITHUB_ENV"
          echo "Synthesis image: $resolved_synth"
          echo "API image: $resolved_api"
          echo "UI image: $resolved_ui"

      - name: Ensure resource group exists
        run: |
          if ! az group show --name "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            az group create \
              --name "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --output none
          fi

      - name: Deploy infrastructure
        id: deploy_bicep
        run: |
          set -euo pipefail
          set +x
          deployment_principal_object_id=$(az ad sp show \
            --id "$AZURE_CLIENT_ID" \
            --query id \
            --output tsv 2>/dev/null || true)

          if [ -z "$deployment_principal_object_id" ]; then
            arm_access_token=$(az account get-access-token \
              --resource https://management.azure.com/ \
              --query accessToken \
              --output tsv)
            echo "::add-mask::$arm_access_token"
            deployment_principal_object_id=$(ARM_ACCESS_TOKEN="$arm_access_token" python3 - <<'PY'
          import base64
          import json
          import os

          token = os.environ["ARM_ACCESS_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(claims.get("oid", ""))
          PY
          )
            unset arm_access_token
          fi

          if [ -z "$deployment_principal_object_id" ]; then
            echo "::error::Could not resolve the Azure deployment service principal object ID."
            exit 1
          fi

          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name main \
            --template-file infra/main.bicep \
            --parameters storageAccountName="$AZURE_STORAGE_ACCOUNT_NAME" \
            --parameters deploymentPrincipalObjectId="$deployment_principal_object_id" \
            --parameters podcasterApiKey="$PODCASTER_API_KEY" \
            --parameters deployApiApp=true \
            --parameters synthesisImage="${SYNTHESIS_IMAGE}" \
            --parameters apiImage="${API_IMAGE}" \
            --parameters spotifyPublishEnabled="${SPOTIFY_PUBLISH_ENABLED:-false}" \
            --parameters spotifyShowId="${SPOTIFY_SHOW_ID:-}" \
            --parameters spotifyClientId="${SPOTIFY_CLIENT_ID:-}" \
            --parameters spotifySessionCookieDc="${SP_DC:-}" \
            --parameters spotifySessionCookieKey="${SP_KEY:-}" \
            --parameters podcastAutoPublish="${PODCAST_AUTO_PUBLISH:-false}" \
            --parameters deployVnet="${DEPLOY_VNET}" \
            --parameters deployUiApp=true \
            --parameters uiImage="${UI_IMAGE}" \
            --parameters msalClientId="${MSAL_CLIENT_ID:-}" \
            --parameters msalAuthority="${MSAL_AUTHORITY:-}" \
            --parameters uiAuthUsername="${UI_AUTH_USERNAME:-}" \
            --parameters uiAuthPassword="${UI_AUTH_PASSWORD:-}" \
            --parameters uiAuthSecret="${UI_AUTH_SECRET:-}" \
            --output none
          echo "### ACA-only Podcaster infrastructure deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Region: $AZURE_LOCATION" >> "$GITHUB_STEP_SUMMARY"

      - name: Get app FQDNs
        id: get_fqdn
        run: |
          fqdn=$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name main \
            --query "properties.outputs.apiAppFqdn.value" \
            --output tsv 2>/dev/null || echo "")
          echo "api_app_fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          ui_fqdn=$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name main \
            --query "properties.outputs.uiAppFqdn.value" \
            --output tsv 2>/dev/null || echo "")
          echo "ui_app_fqdn=$ui_fqdn" >> "$GITHUB_OUTPUT"

      - name: Optionally sync values to SquadScope
        if: ${{ inputs.sync_squadscope == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SQUADSCOPE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SquadScope sync requested but SQUADSCOPE_SYNC_TOKEN is not configured in GitHub environment prod."
            exit 1
          fi
          if [ -z "${PODCASTER_API_KEY:-}" ]; then
            echo "::error::Podcaster API key was not resolved; refusing to sync an empty secret."
            exit 1
          fi
          printf '%s' "$PODCASTER_API_KEY" | gh secret set PODCASTER_API_KEY --repo jmservera/SquadScope
          echo "Synced PODCASTER_API_KEY secret to jmservera/SquadScope." >> "$GITHUB_STEP_SUMMARY"
