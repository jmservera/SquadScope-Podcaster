# ACA-only architecture deploy (#109)
name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      sync_squadscope:
        description: 'Sync API key secret to jmservera/SquadScope when SQUADSCOPE_SYNC_TOKEN is configured'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      deploy_openai:
        description: 'Provision the production Azure OpenAI TTS infrastructure (#30).'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-azure.yml
    with:
      sync_squadscope: ${{ inputs.sync_squadscope }}
      deploy_openai: ${{ inputs.deploy_openai }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
