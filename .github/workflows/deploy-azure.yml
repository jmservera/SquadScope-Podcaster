# ACA-only architecture deploy (#109)
name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      sync_squadscope:
        description: 'Sync API key secret to jmservera/SquadScope when SQUADSCOPE_SYNC_TOKEN is configured'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      deploy_openai:
        description: 'Provision the production Azure OpenAI TTS infrastructure (#30).'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']
      deploy_vnet:
        description: 'Deploy VNet + private endpoints. ⚠️ Create-time only — enabling on existing ACA requires env recreation (downtime).'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      storage_public_network_access:
        description: 'Storage public network access. Disabled (default) preserves the current production posture; set to Enabled only for fresh installs without private endpoint infrastructure (#675).'
        required: false
        default: 'Disabled'
        type: choice
        options: ['Disabled', 'Enabled']

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-azure.yml
    with:
      sync_squadscope: ${{ inputs.sync_squadscope }}
      deploy_openai: ${{ inputs.deploy_openai }}
      deploy_vnet: ${{ inputs.deploy_vnet }}
      storage_public_network_access: ${{ inputs.storage_public_network_access }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
