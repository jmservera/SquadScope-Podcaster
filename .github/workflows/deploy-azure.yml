name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      sync_squadscope:
        description: 'Sync endpoint variable and API key secret to jmservera/SquadScope when SQUADSCOPE_SYNC_TOKEN is configured'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_NAME }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_PACKAGE_CONTAINER_NAME: function-packages
    outputs:
      endpoint: ${{ steps.deploy_bicep.outputs.endpoint }}
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Build Bicep templates
        run: az bicep build --file infra/main.bicep --stdout >/dev/null

      - name: Validate configuration
        env:
          SQUADSCOPE_SYNC_TOKEN: ${{ secrets.SQUADSCOPE_SYNC_TOKEN }}
          SYNC_SQUADSCOPE: ${{ inputs.sync_squadscope }}
        run: |
          set -euo pipefail

          missing=0
          require_config() {
            local name="$1"
            local source="$2"
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in GitHub environment prod $source."
              missing=1
            fi
          }

          require_config AZURE_CLIENT_ID "variables"
          require_config AZURE_TENANT_ID "variables"
          require_config AZURE_SUBSCRIPTION_ID "variables"
          require_config AZURE_LOCATION "variables"
          require_config AZURE_RESOURCE_GROUP "variables"

          if [ "$SYNC_SQUADSCOPE" = "true" ]; then
            require_config SQUADSCOPE_SYNC_TOKEN "secrets for sync_squadscope=true"
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Required configuration present for GitHub environment prod. Optional app/storage names and API key may be derived."

      - name: Resolve deployment names and API key
        env:
          PODCASTER_API_KEY_SECRET: ${{ secrets.PODCASTER_API_KEY }}
        run: |
          set -euo pipefail
          set +x

          suffix=$(printf '%s' "${AZURE_SUBSCRIPTION_ID}:${AZURE_RESOURCE_GROUP}" | sha256sum | cut -c1-12)

          function_prefix=$(printf '%s' "$AZURE_RESOURCE_GROUP" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')
          if [ -z "$function_prefix" ]; then
            function_prefix="podcaster"
          fi
          function_prefix=$(printf '%s' "$function_prefix" | cut -c1-12)
          default_function_app_name="podcaster-${function_prefix}-${suffix}"

          storage_prefix=$(printf '%s' "$AZURE_RESOURCE_GROUP" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+//g' \
            | cut -c1-12)
          if [ -z "$storage_prefix" ]; then
            storage_prefix="podcaster"
          fi
          default_storage_account_name="${storage_prefix}${suffix}"

          function_app_name="${AZURE_FUNCTION_APP_NAME:-$default_function_app_name}"
          storage_account_name="${AZURE_STORAGE_ACCOUNT_NAME:-$default_storage_account_name}"

          if ! [[ "$function_app_name" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]{0,33}[a-zA-Z0-9]$ ]]; then
            echo "::error::AZURE_FUNCTION_APP_NAME must be 2-35 characters, alphanumeric or hyphen, and start/end with alphanumeric. This keeps derived Azure resource names within service limits."
            exit 1
          fi
          if ! [[ "$storage_account_name" =~ ^[a-z0-9]{3,24}$ ]]; then
            echo "::error::AZURE_STORAGE_ACCOUNT_NAME must be 3-24 lowercase alphanumeric characters."
            exit 1
          fi

          if [ -n "${PODCASTER_API_KEY_SECRET:-}" ]; then
            podcaster_api_key="$PODCASTER_API_KEY_SECRET"
            api_key_source="GitHub environment secret PODCASTER_API_KEY"
          else
            podcaster_api_key=$(openssl rand -hex 32)
            api_key_source="generated during this deployment"
            echo "::warning::PODCASTER_API_KEY is not configured in GitHub environment prod; generated a deployment key. Use sync_squadscope=true during this run or set a stable secret and redeploy for manual handoff."
          fi
          echo "::add-mask::$podcaster_api_key"

          {
            echo "AZURE_FUNCTION_APP_NAME=$function_app_name"
            echo "AZURE_STORAGE_ACCOUNT_NAME=$storage_account_name"
            echo "PODCASTER_API_KEY=$podcaster_api_key"
          } >> "$GITHUB_ENV"

          echo "Using Function App name: $function_app_name"
          echo "Using Storage Account name: $storage_account_name"
          echo "API key source: $api_key_source; value not printed."

      - name: Azure login
        # azure/login v2
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --output none

      - name: Deploy infrastructure
        id: deploy_bicep
        run: |
          set -euo pipefail
          set +x
          deployment_principal_object_id=$(az ad sp show \
            --id "$AZURE_CLIENT_ID" \
            --query id \
            --output tsv 2>/dev/null || true)

          if [ -z "$deployment_principal_object_id" ]; then
            arm_access_token=$(az account get-access-token \
              --resource https://management.azure.com/ \
              --query accessToken \
              --output tsv)
            echo "::add-mask::$arm_access_token"
            deployment_principal_object_id=$(ARM_ACCESS_TOKEN="$arm_access_token" python3 - <<'PY'
          import base64
          import json
          import os

          token = os.environ["ARM_ACCESS_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(claims.get("oid", ""))
          PY
          )
            unset arm_access_token
          fi

          if [ -z "$deployment_principal_object_id" ]; then
            echo "::error::Could not resolve the Azure deployment service principal object ID for storage data-plane role assignment."
            exit 1
          fi

          endpoint=$(az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters location="$AZURE_LOCATION" \
            --parameters functionAppName="$AZURE_FUNCTION_APP_NAME" \
            --parameters storageAccountName="$AZURE_STORAGE_ACCOUNT_NAME" \
            --parameters packageContainerName="$AZURE_PACKAGE_CONTAINER_NAME" \
            --parameters deploymentPrincipalObjectId="$deployment_principal_object_id" \
            --parameters podcasterApiKey="$PODCASTER_API_KEY" \
            --query properties.outputs.endpoint.value \
            --output tsv)
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "### Podcaster integration" >> "$GITHUB_STEP_SUMMARY"
          echo "Endpoint: \`$endpoint\`" >> "$GITHUB_STEP_SUMMARY"
          echo "API key: configured as a Function App setting; not printed." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies for package
        run: |
          set -euo pipefail
          rm -rf .python_packages app.zip
          python -m pip install --upgrade pip
          python -m pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Build Function App package
        run: |
          set -euo pipefail
          rm -f app.zip
          python - <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          roots = [
              Path("function_app.py"),
              Path("host.json"),
              Path("podcaster"),
              Path(".python_packages"),
          ]
          required = {
              "function_app.py",
              "host.json",
              "podcaster/__init__.py",
              ".python_packages/lib/site-packages/azure/functions/__init__.py",
          }
          forbidden_dirs = {".git", ".github", ".venv", ".pytest_cache", "__pycache__"}
          forbidden_names = {"local.settings.json"}

          def excluded(path: Path) -> bool:
              return (
                  any(part in forbidden_dirs for part in path.parts)
                  or path.name in forbidden_names
                  or path.name.startswith(".env")
                  or path.suffix == ".pyc"
              )

          with zipfile.ZipFile("app.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for root in roots:
                  paths = [root] if root.is_file() else sorted(path for path in root.rglob("*") if path.is_file())
                  for path in paths:
                      if not excluded(path):
                          archive.write(path, path.as_posix())

          with zipfile.ZipFile("app.zip") as archive:
              names = set(archive.namelist())
              missing = sorted(required - names)
              forbidden = sorted(
                  name for name in names
                  if any(part in forbidden_dirs for part in Path(name).parts)
                  or "/__pycache__/" in name
                  or Path(name).name in forbidden_names
                  or Path(name).name.startswith(".env")
                  or name.endswith(".pyc")
              )
          if missing:
              sys.exit(f"Package missing required files: {', '.join(missing)}")
          if forbidden:
              sys.exit(f"Package contains forbidden files: {', '.join(forbidden[:5])}")
          PY

      - name: Deploy package from private blob
        run: |
          set -euo pipefail
          set +x

          package_blob_name="function-app/${GITHUB_SHA}-${GITHUB_RUN_ID}.zip"
          storage_blob_endpoint=$(az storage account show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_STORAGE_ACCOUNT_NAME" \
            --query primaryEndpoints.blob \
            --output tsv)

          for attempt in 1 2 3 4 5 6; do
            if az storage blob upload \
              --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
              --container-name "$AZURE_PACKAGE_CONTAINER_NAME" \
              --name "$package_blob_name" \
              --file app.zip \
              --overwrite true \
              --auth-mode login \
              --only-show-errors \
              --output none; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::Package upload failed. Ensure the deploy identity has Storage Blob Data Contributor on the storage account."
              exit 1
            fi
            sleep 20
          done

          package_url="${storage_blob_endpoint}${AZURE_PACKAGE_CONTAINER_NAME}/${package_blob_name}"

          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTION_APP_NAME" \
            --settings \
              "WEBSITE_RUN_FROM_PACKAGE=$package_url" \
              "WEBSITE_USE_MANAGED_IDENTITY=true" \
              "WEBSITE_RUN_FROM_PACKAGE_BLOB_MI_RESOURCE_ID=SystemAssigned" \
            --output none

          az functionapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTION_APP_NAME" \
            --output none

          echo "Deployed Function App from private run-from-package blob using managed identity; no package SAS or storage key was emitted." >> "$GITHUB_STEP_SUMMARY"

      - name: Optionally sync values to SquadScope
        if: ${{ inputs.sync_squadscope == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SQUADSCOPE_SYNC_TOKEN }}
          ENDPOINT: ${{ steps.deploy_bicep.outputs.endpoint }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SquadScope sync requested but SQUADSCOPE_SYNC_TOKEN is not configured in GitHub environment prod."
            exit 1
          fi
          if [ -z "${PODCASTER_API_KEY:-}" ]; then
            echo "::error::Podcaster API key was not resolved; refusing to sync an empty secret."
            exit 1
          fi
          gh variable set PODCASTER_ENDPOINT --repo jmservera/SquadScope --body "$ENDPOINT"
          printf '%s' "$PODCASTER_API_KEY" | gh secret set PODCASTER_API_KEY --repo jmservera/SquadScope
          echo "Synced PODCASTER_ENDPOINT variable and PODCASTER_API_KEY secret to jmservera/SquadScope." >> "$GITHUB_STEP_SUMMARY"
