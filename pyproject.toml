[build-system]
# Pin the build backend exactly so the PEP 517 *isolated build environment*
# is reproducible too (#599). Without an exact pin, `pip install .` resolves
# `setuptools` to the latest release satisfying the range each build, which
# would let the build backend drift even though runtime deps are locked.
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "squadscope-podcaster"
version = "0.1.0"
description = "ACA-based podcast generation service for SquadScope."
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.17,<2",
    "azure-storage-blob>=12.20,<13",
    "azure-storage-queue>=12.10,<13",
    "cryptography>=50.0.0,<51",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "PyJWT>=2.7,<3",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
    "spotifyconnector==0.8.2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx2>=0.1", "ruff==0.15.7"]
video = ["playwright>=1.53,<2"]

[tool.ruff]
# Phase A of the DevSecOps Guardrails epic (#518): conservative, warning-only
# baseline. Fixing violations is deferred to Phase B and blocking gates to
# Phase C. See jmservera/SquadScope-Coordinator#33.
line-length = 100
target-version = "py311"
extend-exclude = ["ui", ".worktrees"]

[tool.ruff.lint]
# Conservative starter subset: pycodestyle errors (E), Pyflakes (F),
# and import sorting (I). Broader rule sets come in later phases.
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (requires network + Playwright browsers)",
    "integration: end-to-end integration tests for video, UI and publish pipelines",
]
addopts = "-m 'not slow'"

[tool.setuptools.packages.find]
include = ["podcaster*"]
