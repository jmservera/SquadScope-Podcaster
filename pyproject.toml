[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squadscope-podcaster"
version = "0.1.0"
description = "ACA-based podcast generation service for SquadScope."
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.17,<2",
    "azure-storage-blob>=12.20,<13",
    "fastapi>=0.100,<1",
    "pyyaml>=6.0,<7",
    "requests>=2.28,<3",
    "spotifyconnector==0.8.2",
    "uvicorn>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx2>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["podcaster*"]
